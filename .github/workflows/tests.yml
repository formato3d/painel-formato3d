name: Testes automatizados do Painel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar a suíte de testes (contra um backend falso local — não toca na planilha real)
        run: npm test
